name: Validate AP1000 registers

on:
  push:
    branches: [ main, foundation/public-design-basis ]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate master and system registers
        run: python scripts/validate_registers.py
      - name: Report plant-object completeness
        run: python scripts/completeness_report.py
